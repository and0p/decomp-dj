[workspace]
resolver = "2"
members = [
    "crates/dj-core",
    "crates/dj-cli",
    "crates/dj-gui",
    "crates/dj-decoder",
    "crates/dj-reference-decoders",
    "examples/thwaite/tools",
    "examples/tetris/.decomp/tools/ramdiff",
]
# What a bare `cargo build` / `cargo test` at the root works on: the shipped crates. The
# examples' tools are built by name (`cargo build -p thwaite-tools`).
default-members = [
    "crates/dj-core",
    "crates/dj-cli",
    "crates/dj-gui",
    "crates/dj-decoder",
    "crates/dj-reference-decoders",
]

# The version of every crate here; scripts/package.sh and the release workflow read it.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dj-core = { path = "crates/dj-core" }
dj-decoder = { path = "crates/dj-decoder" }
anyhow = "1"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
embed-resource = "3.0.12"

[profile.release]
debug = 1
