[package]
name = "dj-gui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Desktop viewer and editor for decomp-dj projects"

[[bin]]
name = "dj-gui"
path = "src/main.rs"

[dependencies]
decomp-dj = { path = "../player" }
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "clipboard", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.17"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3.0.12"
