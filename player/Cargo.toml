[package]
name = "decomp-dj"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Plays trees of libretro input segments, checks state hashes, and records ROM code coverage"

[lib]
name = "decomp_dj"
path = "src/lib.rs"

[[bin]]
name = "dj"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
png = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
base64 = "0.22"

[profile.release]
debug = 1

[target."cfg(unix)".dependencies]
libc = "0.2"
