# Builds, tests and packages decomp-dj on Linux, macOS and Windows on every push to main and
# every pull request; the portable ZIPs are kept as artifacts of the run. Windows is allowed
# to fail until it has been tried by hand (.agents/RELEASE_PLAN.md).
#
# Also checks every core dj has a connector for. The cores are listed in
# connectors/cores.toml, and scripts/cores.py turns that list into the `cores` job's matrix,
# so a new core needs a line there and nothing here. For each core: its connector's build.sh
# (kept in a cache until the connector changes), the example's ROM built from source, a
# replay of the example from power-on with every recorded hash compared, and
# `dj connector-check`. Thwaite (Mesen) is also checked against its decomp with `dj parity`.
#
# - Every push: each core on Linux, from the cache (seconds a core). Thwaite on macOS too.
# - A change to a connector or its example: that core on every system it supports.
# - Weekly, and a run started by hand: every core on every system, built anew with no
#   cache, since the pinned sources don't change but the runners' toolchains do.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, experimental: false }
          - { name: macos-arm64, os: macos-15, experimental: false }
          - { name: windows-x86_64, os: windows-2022, experimental: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        # The tests that compile C test cores and plugins skip themselves where there's no
        # `cc` (Windows).
        run: cargo test --release --locked

      - name: Clippy
        # Reported, not yet failing the build: the code has never been through it.
        continue-on-error: true
        run: cargo clippy --release --locked -- -D warnings

      - name: Package
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v5
        with:
          name: decomp-dj-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  dj:
    name: dj for the core checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: macos-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build dj
        run: cargo build --release --locked -p dj-cli

      - uses: actions/upload-artifact@v5
        with:
          name: dj-${{ matrix.name }}
          path: target/release/dj
          if-no-files-found: error
          retention-days: 3

  plan:
    name: Which cores to check
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The history, to see which connectors this push or pull request changed.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: matrix
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python scripts/cores.py matrix --event "${{ github.event_name }}" --base "$BASE" >> "$GITHUB_OUTPUT"

  cores:
    name: ${{ matrix.core }} (${{ matrix.system }})
    needs: [dj, plan]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v5
        with:
          name: dj-${{ matrix.system }}
          path: target/release

      - run: chmod +x target/release/dj

      - name: Packages the core and its ROM need
        run: python scripts/cores.py deps ${{ matrix.core }}

      # A core is built from a pinned commit and the connector's own files, so it is kept
      # until one of those changes. The weekly run builds it anew.
      - uses: actions/cache@v5
        id: core
        if: ${{ !matrix.fresh }}
        with:
          path: build/cores
          key: core-${{ matrix.core }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('connectors/{0}/**', matrix.core), 'include/**') }}

      - name: Build the core
        if: steps.core.outputs.cache-hit != 'true'
        run: python scripts/cores.py build ${{ matrix.core }}

      - uses: actions/cache@v5
        id: rom
        if: ${{ matrix.example != '' && !matrix.fresh }}
        with:
          path: examples/${{ matrix.example }}/build
          key: rom-${{ matrix.example }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('examples/{0}/build-rom.*', matrix.example), format('examples/{0}/src/**', matrix.example), format('examples/{0}/tools/**', matrix.example)) }}

      - name: Build the example's ROM
        if: matrix.example != '' && steps.rom.outputs.cache-hit != 'true'
        run: python scripts/cores.py rom ${{ matrix.core }}

      - name: Replay the example and check the connector
        # Every recorded hash, from power-on: fails if a segment plays differently here.
        run: python scripts/cores.py check ${{ matrix.core }}
