[package]
name = "dj-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The library behind dj and dj-gui: plays trees of libretro input segments, checks state hashes, and records ROM code coverage"

[dependencies]
dj-decoder.workspace = true
anyhow.workspace = true
blake3 = "1"
crc32fast = "1"
libloading = "0.8"
md-5 = "0.10"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
png = "0.17"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
toml.workspace = true
uuid.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

[target."cfg(unix)".dependencies]
libc.workspace = true
