format = 1
dj = "0.1.0"
name = "Thwaite"

[rom]
sha256 = "ee51cd9562f28195ba015d9857c6c4fc9bf67cdfb213e95f655e586b92195173"
file = "thwaite.nes"
# Thwaite is free software (LICENSE.txt), so snapshots of it may be shared (docs/config.md).
shareable = true

[core]
path = "mesen_libretro"
name = "mesen"
build = "mesen@0102910c+dj.f977b8b1"
sha256 = ""

[core.options]
mesen_aspect_ratio = "Auto"
mesen_audio_sample_rate = "48000"
mesen_controllerturbospeed = "Fast"
mesen_disable_noise_mode_flag = "disabled"
mesen_fake_stereo = "disabled"
mesen_fdsautoinsertdisk = "disabled"
mesen_fdsfastforwardload = "disabled"
mesen_hdpacks = "disabled"
mesen_mute_triangle_ultrasonic = "enabled"
mesen_nospritelimit = "disabled"
mesen_ntsc_filter = "Disabled"
mesen_overclock = "None"
mesen_overclock_type = "Before NMI (Recommended)"
mesen_overscan_down = "None"
mesen_overscan_left = "None"
mesen_overscan_right = "None"
mesen_overscan_up = "None"
mesen_palette = "Default"
mesen_ramstate = "All 0s"
mesen_reduce_dmc_popping = "enabled"
mesen_region = "Auto"
mesen_screenrotation = "None"
mesen_shift_buttons_clockwise = "disabled"
mesen_swap_duty_cycle = "disabled"

[[ports]]
port = 1
device = "JOYPAD"
# Mesen also names turbo buttons and Famicom Disk System and VS System controls.
hide = ["Y", "X", "L", "R", "L2", "R2", "L3"]

[hash]
algorithm = "blake3"
regions = ["RAM"]

[tick]
# doStateAction: Thwaite runs it once per game-logic step during play
exec = "PRG:0x197"

[[symbols]]
file = "build/thwaite.dbg"
format = "ca65-dbg"

# The C reimplementation in .decomp/ (build it with .decomp/build.sh). It takes events
# (docs/connectors.md#events): it sets its own breakpoints and copies the original itself.
[[compare]]
name = "decomp"
path = ".decomp/build/thwaite_decomp_libretro"
content = false

[compare.options]
# How the decomp draws (.decomp/README.md): "flat" is the console's picture, "voxel" every
# tile and sprite extruded one voxel deep, in perspective. Parity compares RAM, so this
# only changes what you see.
thwaite_decomp_render = "voxel"
