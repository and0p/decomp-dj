[package]
name = "dj-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "dj, the command line of decomp-dj: plays trees of libretro input segments, checks state hashes, and records ROM code coverage"

[[bin]]
name = "dj"
path = "src/main.rs"

[dependencies]
dj-core.workspace = true
anyhow.workspace = true
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true

[target."cfg(unix)".dependencies]
libc.workspace = true

[build-dependencies]
embed-resource.workspace = true
