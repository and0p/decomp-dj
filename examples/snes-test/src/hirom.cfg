# ld65 layout of the SNES test ROM as HiROM: one 64 KB bank, $C0:0000-$C0:FFFF. Its upper
# half is also at $00:8000, where the start-up code and the vectors run.
MEMORY {
    ZP:    start = $000000, size = $0100, type = rw;
    WRAM:  start = $7E2000, size = $1000, type = rw;
    ROMLO: start = $C00000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROMHI: start = $008000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE1:    load = ROMLO, type = ro;
    CODE:     load = ROMHI, type = ro;
    RODATA:   load = ROMHI, type = ro;
    RAMCODE:  load = ROMHI, run = WRAM, type = ro, define = yes;
    HEADER:   load = ROMHI, type = ro, start = $00FFC0;
    VECTORS:  load = ROMHI, type = ro, start = $00FFE0;
}
