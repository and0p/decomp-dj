# ---- data ---------------------------------------------------------------------------
#
# Jump tables. `jsr switch_s_plus_2a` ($AC82) jumps through the table of 16-bit
# addresses that follows the call, so the bytes after each such jsr are data, not code.
# Each table runs from just after the jsr to the first routine it points at.

[[data]]
range = "PRG:0x0050-0x0059"
why = "$8050 render: jump table, 5 entries"

[[data]]
range = "PRG:0x0166-0x0173"
why = "$8166 branchOnGameMode: jump table, 7 entries"

[[data]]
