# What Tetris (USA) holds that its symbol map doesn't say (docs/config.md).
#
# Offsets are PRG offsets (CPU address - $8000; the 32 KB PRG is mapped whole at
# $8000), ranges inclusive. Labels are from CelestialAmber/TetrisNESDisasm.

# ---- unreachable --------------------------------------------------------------------
#
# Two-player mode. The US release has no way to start a two-player game: the only
# write to numberOfPlayers ($BE) is `lda #$01; sta numberOfPlayers` at boot ($8130),
# so every path taken when numberOfPlayers is 2 (or not 1) is dead, along with the
# routines only those paths call. Two-player code that runs unconditionally in a
# one-player game is not listed: picking player 2's garbage hole in the level menu,
# copying the B-type playfield to player 2's and blanking it, and adding to
# pendingGarbageInactivePlayer after line clears.

[[unreachable]]
range = "PRG:0x018C-0x0197"
why = "$818C gameModeState_updatePlayer2: makePlayer2Active, branchOnPlayStatePlayer2, stageSpriteForCurrentPiece, savePlayer2State"

[[unreachable]]
range = "PRG:0x01D9-0x01FF"
