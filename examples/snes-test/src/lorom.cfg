# ld65 layout of the SNES test ROM as LoROM: two 32 KB banks, at $00:8000 and $01:8000.
MEMORY {
    ZP:    start = $000000, size = $0100, type = rw;
    WRAM:  start = $7E2000, size = $1000, type = rw;
    ROM0:  start = $008000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM1:  start = $018000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = ROM0, type = ro;
    RODATA:   load = ROM0, type = ro;
    RAMCODE:  load = ROM0, run = WRAM, type = ro, define = yes;
    HEADER:   load = ROM0, type = ro, start = $00FFC0;
    VECTORS:  load = ROM0, type = ro, start = $00FFE0;
    CODE1:    load = ROM1, type = ro;
}
